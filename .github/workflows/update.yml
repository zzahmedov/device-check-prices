name: Update price table
on:
  schedule:
    - cron: "17 4 * * *"   # her gun, UTC 04:17 (Baki 08:17)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        run: python collect.py
      - name: Commit changes
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price_table.json state.json
          git diff --cached --quiet || git commit -m "Update price table $(date -u +%F)"
          git push
